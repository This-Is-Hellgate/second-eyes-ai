# Apply D1 schema migrations that are not auto-run on deploy.
# Manual trigger only — use after adding a new seeds/*.sql migration file.
#
# Requires repo secret CLOUDFLARE_API_TOKEN with Account > Cloudflare D1 > Edit
# (Pages deploy tokens often lack D1 write — add D1 Edit at dash.cloudflare.com/profile/api-tokens).
# Runtime fallback: payment logging bootstraps x402_payment_attempts via D1 binding on first use;
# verify with GET /api/bar/proof/d1-schema after deploy.

name: D1 migrate

on:
  workflow_dispatch:
    inputs:
      migration:
        description: SQL file under seeds/ (relative path)
        required: true
        default: x402-payment-log.sql
      remote:
        description: Apply to remote production D1 (true) or local dev DB (false)
        required: true
        default: "true"
        type: choice
        options:
          - "true"
          - "false"

permissions:
  contents: read

jobs:
  migrate:
    name: Apply D1 migration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Preflight — token can reach D1
        if: github.event.inputs.remote == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -uo pipefail
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ] || [ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN and/or CLOUDFLARE_ACCOUNT_ID repo secrets are unset." >&2
            exit 1
          fi
          # A read-only probe surfaces auth/permission problems (code 10000) before
          # we attempt a write, so the failure points at the token, not the SQL.
          if ! npx wrangler d1 execute second-eyes-lawful-loop --remote \
                 --command "SELECT 1;" --json -y > /tmp/d1-preflight.txt 2>&1; then
            echo "::error::D1 preflight failed — the API token cannot access this D1 database." >&2
            echo "::error::Most common cause: the token lacks 'Account > D1 > Edit'. Pages deploy tokens often do not include it." >&2
            echo "::error::Fix at dash.cloudflare.com/profile/api-tokens (add D1 Edit), then re-run this workflow. Live endpoints self-heal via the runtime ensure meanwhile." >&2
            cat /tmp/d1-preflight.txt >&2
            exit 1
          fi
          echo "D1 preflight OK — token can reach the database."

      - name: Apply migration
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -uo pipefail
          FILE="seeds/${{ github.event.inputs.migration }}"
          if [ ! -f "$FILE" ]; then
            echo "::error::Migration file not found: $FILE" >&2
            exit 1
          fi
          REMOTE_FLAG=""
          if [ "${{ github.event.inputs.remote }}" = "true" ]; then
            REMOTE_FLAG="--remote"
          fi
          # grant-product-metadata.sql references access_grants.product_kind /
          # product_slug (CREATE INDEX + backfill UPDATEs). On a fresh DB those
          # columns may not exist yet, and SQLite aborts the WHOLE file on the
          # first missing-column reference. The seed deliberately omits the ALTERs
          # (ADD COLUMN is not idempotent — a bare ALTER aborts once the column
          # exists). Route it through the guarded migration script, which checks
          # pragma_table_info and emits ALTERs only for absent columns BEFORE the
          # backfill, so a direct apply is safe in either column state. (C-024)
          if [ "${{ github.event.inputs.migration }}" = "grant-product-metadata.sql" ]; then
            echo "Applying $FILE via scripts/migrate-grant-product-metadata.mjs (guarded ALTERs) ${REMOTE_FLAG}"
            REMOTE_ARG=""
            if [ "${{ github.event.inputs.remote }}" = "true" ]; then REMOTE_ARG="--remote"; fi
            if ! node scripts/migrate-grant-product-metadata.mjs $REMOTE_ARG 2>&1 | tee /tmp/d1-apply.txt; then
              if grep -qiE "code: ?10000|Authentication error|not authorized|7403" /tmp/d1-apply.txt; then
                echo "::error::D1 apply failed with an auth/permission error (code 10000 / 7403)." >&2
                echo "::error::The CLOUDFLARE_API_TOKEN secret needs 'Account > D1 > Edit'. Add it at dash.cloudflare.com/profile/api-tokens and re-run." >&2
              fi
              exit 1
            fi
            exit 0
          fi
          echo "Applying $FILE ${REMOTE_FLAG}"
          if ! npx wrangler d1 execute second-eyes-lawful-loop $REMOTE_FLAG --file "$FILE" -y 2>&1 | tee /tmp/d1-apply.txt; then
            if grep -qiE "code: ?10000|Authentication error|not authorized|7403" /tmp/d1-apply.txt; then
              echo "::error::D1 apply failed with an auth/permission error (code 10000 / 7403)." >&2
              echo "::error::The CLOUDFLARE_API_TOKEN secret needs 'Account > D1 > Edit'. Add it at dash.cloudflare.com/profile/api-tokens and re-run." >&2
            fi
            exit 1
          fi

      - name: Verify table
        if: github.event.inputs.migration == 'x402-payment-log.sql' && github.event.inputs.remote == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          OUT=$(npx wrangler d1 execute second-eyes-lawful-loop --remote \
            --command "SELECT name FROM sqlite_master WHERE type='table' AND name='x402_payment_attempts';" --json -y)
          echo "$OUT"
          echo "$OUT" | grep -q x402_payment_attempts

      - name: Write summary
        if: always()
        run: |
          {
            echo "## D1 migration"
            echo ""
            echo "| Field | Value |"
            echo "|-------|-------|"
            echo "| Migration | \`seeds/${{ github.event.inputs.migration }}\` |"
            echo "| Remote | \`${{ github.event.inputs.remote }}\` |"
            echo "| Commit | \`${{ github.sha }}\` |"
          } >> "$GITHUB_STEP_SUMMARY"
