# Direct Upload Pages project — deploy via wrangler (not native Cloudflare Git integration).
# Manual deploy from a laptop still works: npx wrangler pages deploy public --project-name=second-eyes-ai
# Requires repo secrets: CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID (see workflow header comments).

name: Deploy Cloudflare Pages

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy second-eyes-ai to Cloudflare Pages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Deploy to Cloudflare Pages
        id: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          set +e
          DEPLOY_OUTPUT=$(npx wrangler pages deploy public \
            --project-name=second-eyes-ai \
            --branch=main \
            --commit-dirty=true 2>&1)
          DEPLOY_EXIT=$?
          set -e
          echo "$DEPLOY_OUTPUT"
          if [ "$DEPLOY_EXIT" -ne 0 ]; then
            echo "wrangler pages deploy failed (exit $DEPLOY_EXIT)" >&2
            exit "$DEPLOY_EXIT"
          fi
          DEPLOY_URL=$(echo "$DEPLOY_OUTPUT" | grep -oE 'https://[a-z0-9-]+\.second-eyes-ai\.pages\.dev' | tail -1)
          if [ -z "$DEPLOY_URL" ]; then
            DEPLOY_URL=$(echo "$DEPLOY_OUTPUT" | grep -oE 'https://[a-z0-9-]+\.pages\.dev' | tail -1)
          fi
          if [ -z "$DEPLOY_URL" ]; then
            echo "Could not parse deployment URL from wrangler output" >&2
            exit 1
          fi
          echo "deployment_url=${DEPLOY_URL}" >> "$GITHUB_OUTPUT"
          echo "commit_sha=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Write deployment summary
        run: |
          {
            echo "## Cloudflare Pages deploy"
            echo ""
            echo "| Field | Value |"
            echo "|-------|-------|"
            echo "| Commit SHA | \`${{ steps.deploy.outputs.commit_sha }}\` |"
            echo "| Deployment URL | ${{ steps.deploy.outputs.deployment_url }} |"
            echo "| Production aliases | https://secondeyesai.com, https://www.secondeyesai.com |"
            echo ""
            echo "Verify: compare \`${{ steps.deploy.outputs.commit_sha }}\` to the commit shown on the latest production deployment in the Cloudflare dashboard."
          } >> "$GITHUB_STEP_SUMMARY"
